{% extends 'base.html' %}
{% block title %}Create User - Warehouse Management{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div style="margin-bottom: 24px;">
        <a href="/users" style="color: var(--primary); text-decoration: none; font-size: 14px; font-weight: 500;">← Back to Users</a>
        <h1 style="margin-top: 8px;">Create New User</h1>
        <p class="subtitle">Assign a role and credentials for the new employee.</p>
    </div>

    <div class="glass panel">
        <form method="post">
            <label>Full Name</label>
            <input name="name" placeholder="e.g. John Doe" required>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div>
                    <label>User ID (Unique)</label>
                    <input name="user_id" placeholder="e.g. EMP004" required>
                </div>
                <div>
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
            </div>

            <label>Role</label>
            <select name="role">
                <option value="employee">Employee (Standard Access)</option>
                <option value="manager">Manager (Verification & Overview)</option>
                <option value="supervisor">Supervisor (Full Control)</option>
            </select>

            <div style="margin-top: 24px;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Create User & Generate QR</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
